name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.14"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check
        run: |
          python -m py_compile scripts/skill_scout.py
          python -m py_compile skills/skill-pilot/scripts/skill_scout.py
          python -m py_compile tests/test_skill_scout.py

      - name: Validate JSON manifests
        run: |
          python -c "import json, pathlib; [json.loads(pathlib.Path(p).read_text(encoding='utf-8')) for p in ['plugin.json', '.codex-plugin/plugin.json', '.agents/plugins/marketplace.json']]; print('JSON manifests valid')"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
