name: Stable release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type publish-v4.0.0 to publish the verified stable release.
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.confirm == 'publish-v4.0.0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Install pinned CI runner
        run: python -m pip install uv==0.13.6

      - name: Qualify the exact stable candidate
        run: >-
          python eval/v4_release_qualification.py
          --output "$RUNNER_TEMP/stable-v4-qualification.json"

      - name: Build reproducible release package
        run: python eval/v4_package_beta.py --output dist

      - name: Create immutable stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v4.0.0"
          test "$(python scripts/skill_scout.py --version | awk '{print $2}')" = "4.0.0"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release $tag."
            exit 1
          fi
          if git rev-parse --verify -q "refs/tags/$tag" >/dev/null; then
            echo "Refusing to reuse existing tag $tag."
            exit 1
          fi
          gh release create "$tag" \
            "dist/skill-pilot-v4.0.0-plugin.zip" \
            "dist/SHA256SUMS" \
            --target "$GITHUB_SHA" \
            --title "Skill Pilot v4.0.0" \
            --notes-file "docs/v4/STABLE_RELEASE_NOTES.md"

      - name: Upload qualification receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stable-v4-qualification
          path: ${{ runner.temp }}/stable-v4-qualification.json
          if-no-files-found: error
